<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscaminas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>💣 Buscaminas</h1>

    <div class="info">
      <span>💣 Minas: <strong id="mines">10</strong></span>
      <button id="reset">Nueva partida</button>
      <span>⏱️ <strong id="timer">0</strong>s</span>
    </div>

    <div id="board" class="board" aria-label="Tablero de Buscaminas"></div>
    <p id="message"></p>
    <p class="help">Clic izquierdo: descubrir · Clic derecho: marcar</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
